<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Result - EduRank</title>
  <script>
      document.documentElement.classList.add(localStorage.getItem("theme") === "light" ? "light" : "dark");
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .result-section {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 5%;
        background: var(--bg);
    }
    :root.dark .result-section { background: var(--bg); }
    .result-card {
        background: var(--surface-glass);
        padding: 40px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 600px;
        width: 100%;
        text-align: center;
    }
    :root.dark .result-card,
    body.dark .result-card { background: var(--surface-glass); }
    .result-status {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    .status-win { color: var(--success); }
    .status-lose { color: #ef4444; }
    
    .elo-gain {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 30px;
    }
    
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 40px;
    }
    .stat-box {
        background: var(--surface-2);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--border);
    }
    :root.dark .stat-box,
    body.dark .stat-box { background: var(--surface-2); }
    .stat-box h3 {
        font-size: 1.5rem;
        margin-bottom: 5px;
    }
    .review-answer-card {
        padding: 16px;
        border-radius: 16px;
        margin-bottom: 12px;
        text-align: left;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.055);
        box-shadow: 0 12px 30px rgba(0,0,0,0.16);
    }
    .review-answer-card.correct {
        border-color: rgba(16,185,129,0.38);
        background: rgba(16,185,129,0.12);
    }
    .review-answer-card.wrong {
        border-color: rgba(239,68,68,0.38);
        background: rgba(239,68,68,0.12);
    }
    .review-answer-card p,
    .review-answer-card span {
        color: var(--text);
    }
    .review-answer-card .answer-key {
        color: #86efac;
    }
    .stat-box p {
        font-size: 0.85rem;
        color: var(--text-light);
    }
    
    .action-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
    }
    .action-buttons button {
        flex: 1;
    }
  </style>
</head>
<body>

  <main class="result-section">
    <div class="result-card">
        <div class="result-status" id="resStatus">VICTORY!</div>
        <div class="elo-gain" id="resPts">+45 Pts | +120 ELO</div>
        
        <div class="stats-grid">
            <div class="stat-box">
                <h3 id="resCorrect">4/5</h3>
                <p>Benar</p>
            </div>
            <div class="stat-box">
                <h3 id="resAccuracy">80%</h3>
                <p>Akurasi</p>
            </div>
            <div class="stat-box">
                <h3 id="resTime">03:12</h3>
                <p>Waktu</p>
            </div>
        </div>
        
        <div id="reviewList" style="margin-bottom: 30px; max-height: 300px; overflow-y: auto;">
            <!-- Review items injected here -->
        </div>
        
        <div class="action-buttons">
            <button class="secondary-btn" onclick="navigateWithTransition('index.html?view=main#home')">Kembali ke Home</button>
            <button class="primary-btn" onclick="navigateWithTransition('battle.html')">Main Lagi</button>
        </div>
    </div>
  </main>

  <script src="interaksi.js"></script>
  <script>
    const score = parseInt(localStorage.getItem('battleScore') || 0);
    const totalQ = parseInt(localStorage.getItem('battleTotal') || 5);
    const oppScore = parseInt(localStorage.getItem('battleOppScore') || 0);
    const accuracy = parseFloat(localStorage.getItem('battleAccuracy') || 0);
    const timeTaken = parseInt(localStorage.getItem('battleTime') || 0);
    const userAnswers = JSON.parse(localStorage.getItem('userAnswers') || "[]");
    const matchQuestions = JSON.parse(localStorage.getItem('matchQuestions') || "[]");
    const gameMode = localStorage.getItem('gameMode') || 'ranked';
    
    // Status & ELO Calculation
    let baseELO = 50;
    let winBonus = 0;
    let timeBonus = Math.max(0, (totalQ * 60) - timeTaken) * 0.5;
    let correctBonus = score * 10;
    
    const statusEl = document.getElementById('resStatus');
    if(score > oppScore) {
        statusEl.innerText = "VICTORY!";
        statusEl.className = "result-status status-win";
        winBonus = 100;
    } else if (score < oppScore) {
        statusEl.innerText = "DEFEAT!";
        statusEl.className = "result-status status-lose";
        winBonus = 10;
    } else {
        statusEl.innerText = "DRAW!";
        statusEl.className = "result-status";
        statusEl.style.color = "var(--warning)";
        winBonus = 30;
    }
    
    // Scale down ELO if not ranked
    if(gameMode !== 'ranked') {
        winBonus = Math.floor(winBonus * 0.2);
        timeBonus = Math.floor(timeBonus * 0.2);
        correctBonus = Math.floor(correctBonus * 0.2);
    }
    
    let totalELO = Math.floor(baseELO + winBonus + timeBonus + correctBonus);
    
    if(gameMode === 'ranked') {
        document.getElementById('resPts').innerText = `+${score*10} Pts | +${totalELO} ELO (Ranked)`;
        let currentELO = parseInt(localStorage.getItem('userELO') || localStorage.getItem('user' + 'LegacyScore') || 0);
        localStorage.setItem('userELO', currentELO + totalELO);
        const subjectKey = localStorage.getItem('gameParam') || 'matematika';
        const oldSubjectELO = getSubjectELO(subjectKey);
        const oldRankName = getRankFromELO(oldSubjectELO).name;
        localStorage.setItem(`elo_${subjectKey}`, oldSubjectELO + totalELO);
        const newRankName = getRankFromELO(oldSubjectELO + totalELO).name;
        const highestRank = localStorage.getItem(`highest_${subjectKey}`) || oldRankName;
        const highestRankIndex = RANK_TIERS.findIndex(item => item.name === highestRank);
        const newRankIndex = RANK_TIERS.findIndex(item => item.name === newRankName);
        if(newRankIndex > highestRankIndex) localStorage.setItem(`highest_${subjectKey}`, newRankName);
        if(oldRankName !== newRankName) {
            localStorage.setItem('rankEvent', JSON.stringify({ subject:subjectKey, from:oldRankName, to:newRankName }));
        }
    } else {
        document.getElementById('resPts').innerText = `+${score*10} Pts | +${totalELO} ELO (Casual)`;
    }

    const currentExp = parseInt(localStorage.getItem('accountEXP') || 0);
    const totalMatches = parseInt(localStorage.getItem('totalMatches') || 0) + 1;
    const totalWins = parseInt(localStorage.getItem('totalWins') || 0) + (score > oppScore ? 1 : 0);
    localStorage.setItem('accountEXP', currentExp + Math.max(25, Math.floor(totalELO * 0.65)));
    localStorage.setItem('totalMatches', totalMatches);
    localStorage.setItem('totalWins', totalWins);
    
    // We removed the old status logic here since we moved it up
    
    document.getElementById('resCorrect').innerText = `${score}/${totalQ}`;
    document.getElementById('resAccuracy').innerText = `${Math.round(accuracy)}%`;
    
    let m = Math.floor(timeTaken / 60);
    let s = timeTaken % 60;
    m = m < 10 ? '0' + m : m;
    s = s < 10 ? '0' + s : s;
    document.getElementById('resTime').innerText = `${m}:${s}`;
    
    // Render Answer Breakdown
    const reviewList = document.getElementById('reviewList');
    if(reviewList && matchQuestions.length > 0) {
        let html = '';
        matchQuestions.forEach((q, idx) => {
            const uAns = userAnswers[idx] !== undefined ? userAnswers[idx] : -1;
            const isCorrect = uAns === q.answer;
            const icon = isCorrect ? '<i class="fa-solid fa-check" style="color:var(--success);"></i>' : '<i class="fa-solid fa-xmark" style="color:#ef4444;"></i>';
            const userText = uAns !== -1 ? q.options[uAns] : 'Tidak dijawab';
            
            html += `
            <div class="review-answer-card ${isCorrect ? 'correct' : 'wrong'}">
                <p style="font-weight: 600; margin-bottom: 5px;">${idx+1}. ${q.q}</p>
                <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
                    <span>Jawabanmu: <strong>${userText}</strong> ${icon}</span>
                    <span class="answer-key">Benar: <strong>${q.options[q.answer]}</strong></span>
                </div>
            </div>`;
        });
        reviewList.innerHTML = html;
    }
    
  </script>
</body>
</html>
