<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard - EduRank</title>
  <script>
    document.documentElement.classList.add(localStorage.getItem("theme") === "light" ? "light" : "dark");
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .leaderboard-section {
        padding-top: 40px;
        min-height: 80vh;
    }
    .leaderboard-container {
        max-width: 1040px;
        margin: 0 auto;
        background: var(--surface-glass);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
    }
    :root.dark .leaderboard-container,
    body.dark .leaderboard-container { background: var(--surface-glass); }
    .leaderboard-header {
        background: var(--gradient-main);
        color: white;
        padding: 20px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .leaderboard-header h2 {
        font-size: 1.5rem;
    }
    .leaderboard-list {
        list-style: none;
    }
    .leaderboard-item {
        display: grid;
        grid-template-columns: 58px 1.4fr 0.8fr 0.7fr 0.9fr;
        align-items: center;
        gap: 16px;
        padding: 18px 26px;
        border-bottom: 1px solid var(--border);
        transition: 0.3s ease;
    }
    .leaderboard-item:hover {
        background: var(--primary-soft);
        transform: translateX(4px);
    }
    :root.dark .leaderboard-item:hover {
        background: var(--border);
    }
    .leaderboard-item:last-child {
        border-bottom: none;
    }
    .rank-num {
        font-size: 1.35rem;
        font-weight: 700;
        width: 52px;
        color: var(--text-light);
    }
    .rank-1 .rank-num { color: #f59e0b; }
    .rank-2 .rank-num { color: #94a3b8; }
    .rank-3 .rank-num { color: #d97706; }
    
    .player-info {
        display: flex;
        align-items: center;
        gap: 15px;
        flex: 1;
    }
    .player-avatar {
        width: 54px;
        height: 54px;
        border-radius: 18px;
        object-fit: cover;
        border: 2px solid rgba(127,119,221,0.34);
    }
    .player-details h4 {
        margin-bottom: 2px;
        font-size: 1rem;
    }
    .player-details p {
        font-size: 0.8rem;
        color: var(--text-light);
    }
    .player-score {
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--primary);
    }
    .player-score span,
    .leaderboard-meta span {
        display: block;
        color: var(--text-light);
        font-size: 0.78rem;
        font-weight: 500;
        margin-top: 3px;
    }
    .leaderboard-meta {
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
    }
    .leaderboard-item.is-me {
        background: rgba(127,119,221,0.16);
        box-shadow: inset 3px 0 0 var(--primary);
    }
    .leaderboard-rank-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        width: fit-content;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 800;
    }
    @media(max-width: 820px) {
        .leaderboard-item {
            grid-template-columns: 44px 1fr;
        }
        .player-score,
        .leaderboard-meta,
        .leaderboard-rank-chip {
            grid-column: 2;
        }
        .leaderboard-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
        }
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="navbar container">
      <a href="index.html?view=main#home" class="nav-logo" style="text-decoration:none;">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>EduRank</span>
      </a>

      <div class="nav-menu" id="navMenu">
        <a href="index.html?view=main#home" class="nav-link">Home</a>
        <a href="index.html?view=main#materi" class="nav-link">Materi</a>
        <a href="index.html?view=main#ranked" class="nav-link">Ranked</a>
        <a href="leaderboard.html" class="nav-link active-link">Leaderboard</a>
      </div>
      <div class="nav-actions">
        <button class="nav-icon-btn" id="darkModeBtn" onclick="toggleDarkMode()">
          <i class="fa-solid fa-moon" id="darkModeIcon"></i>
        </button>
        <div class="nav-search dropdown-container">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Cari username..." id="searchInput"/>
          <div class="dropdown-menu" id="searchDropdown"></div>
        </div>
        <div class="dropdown-container">
          <button class="nav-icon-btn" onclick="toggleDropdown('notifDropdown')">
            <i class="fa-solid fa-bell"></i>
          </button>
          <div class="dropdown-menu" id="notifDropdown" style="right: 0; min-width: 250px;">
            <div class="dropdown-item">Tidak ada notifikasi</div>
          </div>
        </div>
        <a href="profile.html" class="profile-btn">
          <img src="https://i.pravatar.cc/100?img=12" alt="Profile" id="navProfileImg" />
        </a>
      </div>
<button class="nav-icon-btn hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()">
  <i class="fa-solid fa-bars"></i>
</button>
    </nav>
  </header>

  <main>
    <section class="leaderboard-section">
      <div class="container">
        <div class="section-title">
          <h2>Leaderboard</h2>
          <p>Pemain terbaik berdasarkan akumulasi poin Ranked di berbagai tingkat wilayah.</p>
        </div>
        
        <!-- Region Tabs -->
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;">
            <button class="secondary-btn active" id="tabNasional" style="background:var(--primary); color:white;" onclick="changeRegion('Nasional')">Nasional</button>
            <button class="secondary-btn" id="tabProvinsi" onclick="changeRegion('Provinsi')">Provinsi</button>
            <button class="secondary-btn" id="tabKota" onclick="changeRegion('Kota')">Kab/Kota</button>
            <button class="secondary-btn" id="tabSekolah" onclick="changeRegion('Sekolah')">Sekolah</button>
        </div>
        
        <div class="leaderboard-container">
          <div class="leaderboard-header">
            <h2><i class="fa-solid fa-trophy" style="color: #fbbf24; margin-right: 10px;"></i> Top 10 <span id="lblRegion">Nasional</span></h2>
            <select id="mapelSelect" class="leaderboard-filter" onchange="renderLeaderboard()" style="padding: 10px 36px 10px 14px; border-radius: 12px; outline: none; font-family: inherit;">
                <option value="Semua Mapel">Semua Mapel</option>
                <option value="Matematika">Matematika</option>
                <option value="Fisika">Fisika</option>
                <option value="Bahasa Inggris">Bahasa Inggris</option>
                <option value="Informatika">Informatika</option>
            </select>
          </div>
          
          <ul class="leaderboard-list" id="lbList">
             <!-- Injected by JS -->
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>EduRank</span>
      </div>
      <p>© 2026 EduRank. All Rights Reserved.</p>
    </div>
  </footer>
  <script src="interaksi.js"></script>
  <script>
    let currentRegion = 'Nasional';
    
    function changeRegion(region) {
        currentRegion = region;
        document.getElementById('tabNasional').style = "";
        document.getElementById('tabProvinsi').style = "";
        document.getElementById('tabKota').style = "";
        document.getElementById('tabSekolah').style = "";
        
        // Reset classes
        ['tabNasional', 'tabProvinsi', 'tabKota', 'tabSekolah'].forEach(id => {
            document.getElementById(id).classList.remove('active');
            document.getElementById(id).style.background = "";
            document.getElementById(id).style.color = "";
        });
        
        const activeBtn = document.getElementById('tab' + (region === 'Kab/Kota' ? 'Kota' : region));
        if(activeBtn) {
            activeBtn.classList.add('active');
            activeBtn.style.background = "var(--primary)";
            activeBtn.style.color = "white";
        }
        
        document.getElementById('lblRegion').innerText = region;
        renderLeaderboard();
    }
    
    function renderLeaderboard() {
        const list = document.getElementById('lbList');
        const mapel = document.getElementById('mapelSelect').value;
        const myELO = parseInt(localStorage.getItem('userELO') || localStorage.getItem('user' + 'LegacyScore') || 0);
        const myName = localStorage.getItem('name') || 'Guest User';
        const myAvatar = localStorage.getItem('avatar') || 'https://i.pravatar.cc/100?img=12';
        const mapelFactor = {
            "Semua Mapel": 1,
            "Matematika": 1.08,
            "Fisika": 0.94,
            "Bahasa Inggris": 0.88,
            "Informatika": 1.14
        }[mapel] || 1;
        
        list.innerHTML = '';
        
        // Generate mock players based on region
        let multiplier = 1;
        if(currentRegion === 'Nasional') multiplier = 50;
        if(currentRegion === 'Provinsi') multiplier = 20;
        if(currentRegion === 'Kota') multiplier = 10;
        if(currentRegion === 'Sekolah') multiplier = 2;
        
        const basePlayers = [
            ["Alya Putri","@alya.stem",1986,"SMA Negeri 8 Jakarta","Indonesia",74,21],
            ["Raka Mahendra","@raka.logic",1742,"SMA Labschool Kebayoran","Indonesia",69,15],
            ["Nadine Zhou","@nadine.phys",1510,"Jakarta Intercultural School","Indonesia",71,47],
            ["Daffa Pratama","@daffa.rank",1294,"SMA Negeri 3 Bandung","Indonesia",63,33],
            ["Maya Kirana","@maya.code",1120,"SMA Santa Ursula","Indonesia",66,26],
            ["Fathan Rey","@fathan.math",875,"MAN Insan Cendekia","Indonesia",58,18],
            ["Keisha Amalia","@keisha.quiz",720,"SMA Al Azhar BSD","Indonesia",61,44],
            ["Bima Satria","@bima.arc",512,"SMA Negeri 1 Surabaya","Indonesia",55,11],
            ["Clara Wijaya","@clara.learn",318,"SMAK Penabur Gading","Indonesia",52,29]
        ];
        let players = basePlayers.map((item, idx) => ({
            name:item[0],
            user:item[1],
            elo:Math.max(1, Math.floor(item[2] * (multiplier / 50 || 1) * mapelFactor)),
            school:item[3],
            country:item[4],
            winrate:item[5],
            img:`https://i.pravatar.cc/100?img=${item[6]}`
        }));
        
        // Add current user
        players.push({
            name: myName,
            user: '@me',
            elo: mapel === "Semua Mapel" ? getTotalSubjectELO() : getSubjectELO(mapel.toLowerCase().replace(/\s/g, "")),
            img: myAvatar,
            school: localStorage.getItem('prof_school') || 'SMA Nusantara',
            country: localStorage.getItem('prof_negara') || 'Indonesia',
            winrate: (() => {
                const matches = parseInt(localStorage.getItem('totalMatches') || 0);
                const wins = parseInt(localStorage.getItem('totalWins') || 0);
                return matches ? Math.round((wins / matches) * 100) : 0;
            })(),
            isMe: true
        });
        
        // Sort descending
        players.sort((a,b) => b.elo - a.elo);
        
        players.forEach((p, idx) => {
            let rankClass = '';
            let rankNum = idx + 1;
            if(rankNum === 1) rankClass = 'rank-1';
            else if(rankNum === 2) rankClass = 'rank-2';
            else if(rankNum === 3) rankClass = 'rank-3';
            const rank = getRankFromELO(p.elo);
            
            let html = `
            <li class="leaderboard-item ${rankClass} ${p.isMe ? 'is-me' : ''}">
              <div class="rank-num">#${rankNum}</div>
              <div class="player-info">
                <img src="${p.img}" alt="Avatar" class="player-avatar">
                <div class="player-details">
                  <h4>${p.name} ${p.isMe ? '(You)' : ''}</h4>
                  <p>${p.user}</p>
                </div>
              </div>
              <div class="player-score">${p.elo.toLocaleString()} ELO <span>${rank.name}</span></div>
              <div class="leaderboard-meta">${p.winrate}% <span>Winrate</span></div>
              <div class="leaderboard-meta">${p.school} <span>${p.country}</span></div>
            </li>
            `;
            list.innerHTML += html;
        });
    }
    
    // Init
    renderLeaderboard();
  </script>
</body>
</html>
